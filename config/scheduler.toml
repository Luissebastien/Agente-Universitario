# Agente U - Scheduler MVP configuration (.ai/SCHEDULER-MVP-RULES.md).
#
# Secrets are NEVER configured here: MOODLE_URL and MOODLE_TOKEN come from
# environment variables only. DATABASE_URL in .env.example is not read; the
# database location is `database_path` below.
#
# Relative paths are resolved against THIS file's directory. The defaults
# keep private data in <project>/data/, which .gitignore excludes. NOTE: this
# project lives in a OneDrive-synced folder; to keep the private database and
# downloaded originals out of the cloud, point both paths to a folder that is
# not synced (e.g. "C:/Users/<you>/AppData/Local/AgenteU/agente_u.sqlite3").

[scheduler]
timezone = "America/Santo_Domingo"
database_path = "../data/agente_u.sqlite3"
storage_path = "../data/originals"
# Pause between the (at most 3) attempts of a failing job.
retry_delay_seconds = 60
# Whether `python -m scheduler --job NAME` may run a job disabled below.
allow_manual_disabled_jobs = false

[moodle_sync]
enabled = true
interval_hours = 6

[ingestion]
enabled = true
# Processing budget per run; whatever is left stays pending for the next run.
max_items = 100
max_seconds = 1800

[extraction]
enabled = true
max_items = 50
max_seconds = 1800

[notifications]
enabled = true
# Reminders run on their own clock schedule, independent of the Moodle sync
# chain: every hour on the hour, in the configured timezone. The cycle is not
# configurable - it and the reminders below are not independent settings, so
# pinning it removes any way to configure reminders that never get delivered.
# The floor it sets: reminders must be at least 1 hour apart.

# One entry per reminder. The bands between them are derived, so removing the
# 12h entry simply widens the 24h one to cover (6h, 24h]; no code changes.
# Each reminder is delivered at most once per assignment and deadline, and a
# deadline the professor moves starts a fresh series.
# Placeholders: {assignment} {course} {due} {due_date} {due_time} {remaining} {tz}
# Add enabled = false to keep an entry without delivering it.

[[notifications.reminders]]
id = "24h"
offset_hours = 24
title = "Tarea por vencer mañana: {assignment}"
body = "{course} — vence el {due_date} a las {due_time}. Quedan {remaining}."

[[notifications.reminders]]
id = "12h"
offset_hours = 12
title = "Tarea por vencer hoy: {assignment}"
body = "{course} — vence a las {due_time}. Quedan {remaining}."

[[notifications.reminders]]
id = "6h"
offset_hours = 6
title = "Quedan {remaining}: {assignment}"
body = "{course} — vence hoy a las {due_time}."

[[notifications.reminders]]
id = "1h"
offset_hours = 1
title = "Última hora: {assignment}"
body = "{course} — vence a las {due_time}, en {remaining}."
